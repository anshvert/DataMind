[project]
name = "naturallangdata"
version = "0.2.0"
description = "A learning-first PDF RAG app with FastAPI, LangGraph and Qdrant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.3.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.2",
  "pandas>=2.2.0",
  "openpyxl>=3.1.5",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=1.0.0",
  "qdrant-client>=1.9.0",
  "pydantic-settings>=2.0.0",
  "numpy>=1.26.0",
  "python-dotenv>=1.0.0",
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "datasette>=0.65.3",
  "duckdb>=1.5.5",
  "redis>=8.1.0",
  "sqlglot>=30.18.0",
  "sse-starlette>=3.4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["naturallangdata"]
